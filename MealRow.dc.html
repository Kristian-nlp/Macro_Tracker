<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-end;justify-content:space-around;height:84px;padding:10px 20px 16px;background:#F4F1E8;border-top:1px solid #E3E0D2;font-family:system-ui,-apple-system,sans-serif;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ todayCol }};flex:1;">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle></svg>
    <span style="font-size:10px;letter-spacing:.05em;font-weight:600;">Today</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ historyCol }};flex:1;">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3.2 1.8"></path></svg>
    <span style="font-size:10px;letter-spacing:.05em;font-weight:600;">History</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ settingsCol }};flex:1;">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.7 6.7l1.4 1.4M15.9 15.9l1.4 1.4M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4"></path></svg>
    <span style="font-size:10px;letter-spacing:.05em;font-weight:600;">Settings</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
    <div style="width:54px;height:54px;border-radius:50%;background:#55654C;display:grid;place-items:center;box-shadow:0 12px 22px -8px rgba(85,101,76,.6);margin-top:-26px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;history&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'today';
    const on = '#1B1D17', off = '#A0A294';
    return {
      todayCol: a === 'today' ? on : off,
      historyCol: a === 'history' ? on : off,
      settingsCol: a === 'settings' ? on : off,
    };
  }
}
</script>
</body>
</html>
